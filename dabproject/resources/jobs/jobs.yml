resources:
  jobs:
    Injestion_Job:
      name: Injestion_Job
      tasks:
        - task_key: Injestion
          notebook_task:
            notebook_path: ../../src/notebooks/injestion.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
